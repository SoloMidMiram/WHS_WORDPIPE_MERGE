name: Windows readiness evidence
on:
  push:
    branches: [codex/windows-chain-readiness-diagnostics]
jobs:
  readiness:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[chronicle,test]"
      - name: Preserve full-suite startup context
        shell: pwsh
        run: |
          $env:WHS_READINESS_DIAGNOSTIC = Join-Path $env:RUNNER_TEMP "readiness.json"
          python -m pytest tests -q --wordpipe-origin=source
          $result = $LASTEXITCODE
          if (Test-Path -LiteralPath $env:WHS_READINESS_DIAGNOSTIC) {
            Get-Content -LiteralPath $env:WHS_READINESS_DIAGNOSTIC
          } else {
            Write-Host 'Readiness diagnostic was not captured'
          }
          exit $result
