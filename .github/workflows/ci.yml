name: Windows readiness evidence
on:
  pull_request:
    branches: [main]
jobs:
  readiness:
    if: github.head_ref == 'codex/windows-chain-readiness-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            extras: chronicle,test
          - python-version: "3.11"
            extras: chronicle,test
          - python-version: "3.11"
            extras: chronicle,docx,test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Preserve full-suite startup context
        shell: pwsh
        run: |
          $env:WHS_READINESS_DIAGNOSTIC = Join-Path $env:RUNNER_TEMP "readiness.json"
          python -m pytest tests -q --wordpipe-origin=source
          $result = $LASTEXITCODE
          if (Test-Path -LiteralPath $env:WHS_READINESS_DIAGNOSTIC) {
            Get-Content -LiteralPath $env:WHS_READINESS_DIAGNOSTIC
          } else {
            Write-Host 'Readiness diagnostic was not captured'
          }
          exit $result
