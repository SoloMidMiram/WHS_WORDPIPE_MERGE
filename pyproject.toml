[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordpipe"
version = "0.1.0"
description = "Modular DOCX pipeline helpers (TraceLedger-oriented)."
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SoloMidMiram", email = "tp.nouri@gmail.com" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SoloMidMiram/WHS_WORDPIPE_MERGE"

[project.optional-dependencies]
# Base install is intentionally dependency-light; extras opt-in to features.
core = []
chronicle = [
  "pyyaml>=6.0",
  "python-dateutil>=2.8.2",
  "markdown-it-py>=3",
]
test = ["pytest>=9", "Jinja2>=3.1"]
docx = ["python-docx>=1.1.0"]
ai = ["openai>=1.0.0", "python-dotenv>=1.0.0"]
cli = ["python-docx>=1.1.0"]
full = [
  "python-docx>=1.1.0",
  "pyyaml>=6.0",
  "python-dateutil>=2.8.2",
  "markdown-it-py>=3",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
wordpipe = "wordpipe.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "_WORK",
    "_ARCHIVE",
    "inputs",
    "0209-*",
    ".git",
    "wordpipe/legacy",
    "WordHorrorStories/legacy",
    "scripts",
]

[tool.setuptools.packages.find]
include = ["wordpipe*"]
exclude = ["wordpipe.ai*", "wordpipe.legacy*"]
